services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'

  # Application image (Dockerfile). Only started with the "app" compose profile, so the Spring Boot
  # Docker Compose support of the dev run keeps starting the database alone:
  #   docker compose --profile app up --build
  app:
    profiles: [ 'app' ]
    build: .
    image: 'tensio:latest'
    depends_on:
      - postgres
    environment:
      - 'SPRING_PROFILES_ACTIVE=dev'
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mydatabase'
      - 'SPRING_DATASOURCE_USERNAME=myuser'
      - 'SPRING_DATASOURCE_PASSWORD=secret'
    ports:
      - '8080:8080'
