spring:
  application:
    name: ml-sb-tensio
  datasource:
    username: myuser
    password: ENC(dMvpCJ4t8Nb0/bhzVbgVnw==)
    url: jdbc:postgresql://localhost:5432/mydatabase
    driver-class-name: org.postgresql.Driver
  flyway:
    # Dummy data (db/dev) runs only with the "dev" profile. Versions are shared with db/migration,
    # so a new dummy script must use a version number not taken by a schema migration.
    locations:
      - classpath:db/migration
      - classpath:db/dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
    algorithm: PBEWITHHMACSHA512ANDAES_256