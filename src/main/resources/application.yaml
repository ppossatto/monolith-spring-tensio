spring:
  application:
    name: ml-sb-tensio

server:
  port: ${SERVER_PORT:8080}
  http2:
    enabled: true
  compression:
    enabled: true
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

tensio:
  # Sender and links of the diagnosis summary e-mails
  mail:
    from: ${TENSIO_MAIL_FROM:tensio@localhost}
  base-url: ${TENSIO_BASE_URL:http://localhost:8080}
  dga:
    limits:
      h2:   { alert: 100,  danger: 200,  alert-rate: 10, danger-rate: 20 }
      ch4:  { alert: 120,  danger: 240,  alert-rate: 10, danger-rate: 20 }
      c2h2: { alert: 50,   danger: 100,  alert-rate: 10, danger-rate: 20 }
      c2h4: { alert: 100,  danger: 200,  alert-rate: 10, danger-rate: 20 }
      c2h6: { alert: 65,   danger: 130,  alert-rate: 10, danger-rate: 20 }
      co:   { alert: 500,  danger: 1000, alert-rate: 10, danger-rate: 20 }
      co2:  { alert: 4000, danger: 8000, alert-rate: 10, danger-rate: 20 }
      # Non-combustible gases without fault limits: only "reference" (ppm, 100% in the gas profile chart).
      # TODO: set the reference values for O2 and N2.
      # o2:   { reference: <ppm> }
      # n2:   { reference: <ppm> }
